
x-airflow-common: &airflow-common
  image: nyc-taxi-airflow:3.3.1
  build:
    context: .
    dockerfile: Dockerfile.airflow

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@warehouse:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    DB_HOST: warehouse
    DB_PORT: "5432"
    DB_NAME: ${POSTGRES_DB}
    DB_USER: taxi_admin
    DB_PASSWORD: ${POSTGRES_PASSWORD}

    TAXI_INGEST_PASSWORD: ${TAXI_INGEST_PASSWORD}

    DBT_USER: taxi_transform
    DBT_PASSWORD: ${TAXI_TRANSFORM_PASSWORD}
    DBT_PROFILES_DIR: /opt/airflow/config/dbt

    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_PORT: "5432"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./:/opt/airflow/project

  networks:
    - taxi_network

  restart: unless-stopped


services:

  warehouse:
    image: postgres:16
    container_name: taxi_warehouse
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - taxi_network


  metabase:
    image: metabase/metabase:latest
    container_name: taxi_metabase
    restart: unless-stopped

    ports:
      - "${METABASE_PORT}:3000"

    depends_on:
      warehouse:
        condition: service_healthy

    networks:
      - taxi_network


  airflow-init:
    <<: *airflow-common
    container_name: taxi_airflow_init

    entrypoint: /bin/bash

    command:
      - -c
      - airflow db migrate

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@warehouse:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

    depends_on:
      warehouse:
        condition: service_healthy

    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    container_name: taxi_airflow_api_server

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    container_name: taxi_airflow_scheduler

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:
    <<: *airflow-common
    container_name: taxi_airflow_dag_processor

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-triggerer:
    <<: *airflow-common
    container_name: taxi_airflow_triggerer

    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres_data:


networks:
  taxi_network:
    driver: bridge

