name: nyc_taxi_warehouse
version: '1.0.0'
config-version: 2

profile: nyc_taxi_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: mart

seeds:
  nyc_taxi_warehouse:
    taxi_zone_lookup:
      +schema: staging
      +column_types:
        LocationID: integer
        Borough: varchar(50)
        Zone: varchar(100)
        service_zone: varchar(50)
